site_name: hopai
site_description: >-
  A knowledge graph in the PostgreSQL you already run: multi-hop traversal,
  ingestion and real constraints, with Python, JSON and Cypher interfaces --
  no graph database required.
# Read the Docs serves every version at its own path -- /en/stable/,
# /en/latest/, /en/v0.0.1/ -- so a hard-coded site_url would be correct for
# exactly one of them and wrong for the rest. RTD stamps the per-version
# canonical URL into the environment; the default is what a local
# `mkdocs serve` and the CI build (which publishes nothing) use.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://hopai.readthedocs.io/en/latest/"]
repo_url: https://github.com/alexbojko/hopai
repo_name: alexbojko/hopai
copyright: MIT-licensed

# Three tiers, three different guarantees against going stale.
# docs/index.md, docs/notebooks and docs/benchmarks are symlinks to
# README.md, notebooks/ and benchmarks/, so there is exactly one copy of
# the landing page and the executed examples -- editing the README or a
# notebook IS editing the site, and neither may gain a second copy anywhere
# else. benchmarks/benchmarks.ipynb is executed and committed by hand, not
# by CI (it needs a real Neo4j instance, which nothing here provisions),
# so it is a snapshot rather than a standing regression check -- the
# notebook's own intro says so. docs/reference/*.md are real files: a
# deliberate SECOND place, holding the guide prose (semantics, gotchas, error
# messages) neither a notebook nor a docstring is the right shape for --
# reviewed like any other doc, not regenerated. docs/api/*.md are real files
# too, but hold no prose of their own: each is a `mkdocstrings` directive
# that renders straight from hopai's own docstrings and signatures at build
# time, so that tier cannot drift from the code no matter how stale the page
# on disk looks.
docs_dir: docs

# A notebook added to notebooks/ arrives in the site automatically (docs/ is a
# symlink) but NOT in the nav, which has to name it. MkDocs logs that at INFO,
# so `--strict` stayed green while 09_vector_search was built, reachable only
# by URL, and invisible in the navigation. Promoting it to a warning makes
# `--strict` fail instead: adding a notebook now has to say where it goes.
validation:
  nav:
    omitted_files: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Switch to light mode}

# Not a plugin and not a dependency -- a plain module MkDocs imports. See the
# docstring for the one thing it fixes.
hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # No `paths:` needed -- the build installs hopai itself
          # (`pip install -e ".[docs]"`), so the handler imports the real,
          # importable package rather than reading source off disk.
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            docstring_section_style: spacy
            members_order: source
            # hopai's docstrings are prose, not Args:/Returns: blocks --
            # nothing to mis-parse either way, so this only matters if one
            # ever gains structured sections.
            docstring_style: google
  - mkdocs-jupyter:
      # The committed outputs are the documentation -- CI executes the
      # notebooks against a real PostgreSQL on every PR (see the `notebooks`
      # job), so the site renders what that run produced. Turning this on
      # would mean the docs build needed a database, and would publish
      # outputs that no assertion had ever checked.
      execute: false
      # A "download this notebook" link on every notebook page: the whole
      # point of documentation that runs is that a reader can run it.
      include_source: true
      ignore: ["notebooks/demo_graph.py", "benchmarks/*.py"]

markdown_extensions:
  - admonition
  - attr_list
  # GitHub's renderer processes markdown inside a raw HTML block by default
  # (why `<div align="center">` + a heading + badges works there); Python-
  # Markdown does not, unless the block opts in with `markdown="1"` -- so
  # the README's title block rendered as literal, un-rendered source text
  # on the docs site until this was added. Requires the opt-in attribute on
  # the tag itself; enabling the extension alone changes nothing.
  - md_in_html
  - toc:
      permalink: true
      # GitHub-compatible anchors, so that ONE README serves both renderers.
      # The headings carry emoji, and the two slugifiers disagree about them:
      # GitHub strips the emoji and keeps the separator (`#-graph-schema`),
      # Python-Markdown's default drops both (`#graph-schema`). Without this
      # every in-page link in the README is dead on one of the two sites.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Notebooks:
      - All ten: notebooks/README.md
      - 01 · Quick start: notebooks/01_quickstart.ipynb
      - 02 · Traversal: notebooks/02_traversal.ipynb
      - 03 · Aggregation: notebooks/03_aggregation.ipynb
      - 04 · JSON and Cypher: notebooks/04_json_and_cypher.ipynb
      - 05 · Constraints: notebooks/05_constraints.ipynb
      - 06 · Graph schema: notebooks/06_graph_schema.ipynb
      - 07 · Many graphs: notebooks/07_many_graphs.ipynb
      - 08 · Under the hood: notebooks/08_under_the_hood.ipynb
      - 09 · Vector search: notebooks/09_vector_search.ipynb
      - 10 · Reranking: notebooks/10_reranking.ipynb
  - Benchmarks:
      - hopai vs. raw CTEs, vs. Neo4j: benchmarks/benchmarks.ipynb
      - All benchmarks: benchmarks/README.md
  - Reference:
      - Schema: reference/schema.md
      - Many graphs, one database: reference/multi-graph.md
      - Getting data in: reference/ingestion.md
      - Changing and deleting: reference/mutations.md
      - Constraints: reference/constraints.md
      - Graph schema: reference/graph-schema.md
      - Filters: reference/filters.md
      - Traversal, direction and OPTIONAL: reference/traversal.md
      - Aggregation: reference/aggregation.md
      - Vector search: reference/vector-search.md
      - Reranking: reference/reranking.md
      - The JSON interface: reference/json-interface.md
      - Cypher as input syntax: reference/cypher.md
      - What this doesn't do (yet): reference/limits.md
  - API reference:
      - hopai.core (Graph, Subgraph): api/core.md
      - hopai.hop (Start, Hop): api/hop.md
      - hopai.filters: api/filters.md
      - hopai.aggregates: api/aggregates.md
      - hopai.ingest: api/ingest.md
      - hopai.mutate: api/mutate.md
      - hopai.constraints: api/constraints.md
      - hopai.schema: api/schema.md
      - hopai.vectors: api/vectors.md
      - hopai.rerankers: api/rerankers.md
      - hopai.embeddings: api/embeddings.md
      - hopai.cypher: api/cypher.md
      - hopai.json_api: api/json_api.md
      - hopai.models: api/models.md
      - hopai.asyncio: api/asyncio.md
      - hopai.mcp: api/mcp.md
  - Guides:
      - MCP server: mcp.md
  - Internals:
      - Architecture: architecture.md
      - Testing: testing.md
      - Releasing: releasing.md

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: hopai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      HOPAI_TEST_DSN: postgresql+psycopg2://postgres:testpass@localhost:5432/hopai
      # Without this a missing database would turn every database-backed
      # test into a skip, and CI would pass having tested nothing.
      HOPAI_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v

  # The notebooks in notebooks/ are documentation that runs. Executing them on
  # every PR is what stops them from documenting an API the library no longer
  # has -- they assert on behaviour, so a regression fails here too.
  notebooks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: hopai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      HOPAI_DSN: postgresql+psycopg2://postgres:testpass@localhost:5432/hopai
      # Without this a missing database would turn the whole run into a skip.
      HOPAI_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[notebooks]"
      # Not --save: CI verifies that they run, and never rewrites the committed
      # outputs. Regenerating those is a deliberate local step.
      - run: python scripts/run_notebooks.py

  # Coverage gates the PR; mutation testing rides along in the same job so
  # both land in ONE sticky comment. Two jobs would mean two comments, or
  # an artifact hand-off just to merge two numbers.
  quality:
    name: coverage + mutation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # to upsert the sticky comment

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: hopai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      HOPAI_TEST_DSN: postgresql+psycopg2://postgres:testpass@localhost:5432/hopai
      HOPAI_REQUIRE_DB: "1"
      COVERAGE_THRESHOLD: "85"
      # Wall-clock cap on mutmut. Mutation is worth having and not worth
      # waiting on: past this the run is stopped and whatever it finished
      # is reported as partial.
      MUTATION_BUDGET_SECONDS: "900"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the mutation scope is a diff against the base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev,mutation]"

      - name: Measure coverage
        # No --cov-fail-under here on purpose: the threshold is enforced
        # in the LAST step, so a failing PR still gets its comment saying
        # by how much it fell short.
        run: pytest tests/ -q --cov=hopai --cov-report=xml --cov-report=term

      - name: Resolve mutation scope
        id: scope
        # Mutate only what this PR touched. A full run over hopai/ is
        # thousands of mutants; the changed lines are where a missing
        # assertion was just introduced.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            CHANGED=$(git diff --name-only --diff-filter=d "${BASE_SHA}" HEAD -- 'hopai/*.py' | tr '\n' ' ')
          else
            CHANGED=""
          fi
          if [ -z "${CHANGED// /}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "note=No files under \`hopai/\` changed, so there was nothing to mutate." >> "$GITHUB_OUTPUT"
          else
            COUNT=$(echo "${CHANGED}" | wc -w | tr -d ' ')
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "note=Scope: ${COUNT} changed file(s) under \`hopai/\`." >> "$GITHUB_OUTPUT"
            # Narrow source_paths in the checked-out copy. The committed
            # value covers the whole package for local runs; `hopai` stays
            # in also_copy, so the package is still whole in the mutants
            # tree (without it every test dies on an import error).
            #
            # The paths MUST be newline-separated (the ini continuation
            # format also_copy uses): mutmut reads a space-separated line
            # as ONE path that does not exist, mutates 0 files, and still
            # exits 0 -- so every multi-file PR silently reported
            # "not run" instead of any verdict.
            python - "$CHANGED" <<'PY'
          import re, sys
          paths = "\n    ".join(sys.argv[1].split())
          config = open("setup.cfg").read()
          open("setup.cfg", "w").write(
              re.sub(r"^source_paths = .*$", f"source_paths = {paths}", config, count=1, flags=re.M))
          PY
          fi

      - name: Run mutation testing
        if: steps.scope.outputs.run == 'true'
        # Never fails the job. `timeout` stops a long run and the stats
        # export below still reports what completed.
        continue-on-error: true
        run: |
          set -uo pipefail
          timeout "${MUTATION_BUDGET_SECONDS}" mutmut run || \
            echo "::notice::mutmut stopped early (budget or non-zero exit); reporting partial results"
          mutmut export-cicd-stats || true
          mutmut results > survivors.txt 2>&1 || true

      - name: Render report
        id: report
        # The note reaches the script through the environment, never
        # through `${{ }}` inside the script body. Interpolating it
        # produced `No files under  changed` -- the backticks around
        # `hopai/` were read by the shell as command substitution, which
        # is a mangled comment in the benign case and arbitrary execution
        # in the general one.
        env:
          MUTATION_NOTE: ${{ steps.scope.outputs.note }}
          # Set only when mutmut was actually invoked, so "no results"
          # can be reported as a broken harness rather than as an empty
          # scope. The two must never look alike.
          MUTATION_ATTEMPTED: ${{ steps.scope.outputs.run == 'true' && '1' || '' }}
        run: |
          set -euo pipefail
          python scripts/pr_report.py \
            --coverage-xml coverage.xml \
            --threshold "${COVERAGE_THRESHOLD}" \
            --mutmut-stats mutants/mutmut-cicd-stats.json \
            --mutmut-results survivors.txt \
            --mutation-note "${MUTATION_NOTE}" \
            ${MUTATION_ATTEMPTED:+--mutation-attempted} \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert sticky comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # One comment per PR: find the previous one by its marker and
          # PATCH it, else POST. The body goes through json.dumps so no
          # markdown character can corrupt the payload.
          python -c "import json;print(json.dumps({'body': open('comment.md').read()}))" > payload.json
          EXISTING=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- hopai-pr-report -->")) | .id' | head -n1)
          if [ -n "${EXISTING}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING}" --input payload.json >/dev/null
            echo "updated sticky comment ${EXISTING}"
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" --input payload.json >/dev/null
            echo "created sticky comment"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: |
            coverage.xml
            comment.md
            survivors.txt
            mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore

      - name: Enforce coverage threshold
        # Last, so the comment is already posted when this fails.
        run: |
          set -euo pipefail
          PERCENT=$(python -c "
          import xml.etree.ElementTree as ET
          print(f\"{float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100:.2f}\")")
          echo "line coverage: ${PERCENT}% (required ${COVERAGE_THRESHOLD}%)"
          python -c "
          import sys
          sys.exit(0 if float('${PERCENT}') >= float('${COVERAGE_THRESHOLD}') else 1)" || {
            echo "::error::coverage ${PERCENT}% is below the required ${COVERAGE_THRESHOLD}%"
            exit 1
          }

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: hopai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      HOPAI_TEST_DSN: postgresql+psycopg2://postgres:testpass@localhost:5432/hopai
      # Without this a missing database would turn every database-backed
      # test into a skip, and CI would pass having tested nothing.
      HOPAI_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v

  # The notebooks in notebooks/ are documentation that runs. Executing them on
  # every PR is what stops them from documenting an API the library no longer
  # has -- they assert on behaviour, so a regression fails here too.
  notebooks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: hopai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      HOPAI_DSN: postgresql+psycopg2://postgres:testpass@localhost:5432/hopai
      # Without this a missing database would turn the whole run into a skip.
      HOPAI_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[notebooks]"
      # --check, not --save: CI verifies that the notebooks run AND that what
      # they print still matches the committed outputs (after normalizing
      # execution metadata and timing-shaped numbers -- see mask_timings() in
      # scripts/run_notebooks.py), but it never rewrites them. A bare run only
      # answers "does this still execute" -- an API change can leave a
      # notebook running cleanly while quietly printing something stale, which
      # is what --check catches. Regenerating the committed outputs with
      # --save is a deliberate local step.
      - run: python scripts/run_notebooks.py --check

  # The documentation site (mkdocs.yml), built but never published here --
  # Read the Docs publishes it, from the release tag (see .readthedocs.yaml).
  # Building on every PR is what keeps a broken nav entry or a dead link from
  # surfacing at release time, when the tag is already cut and the fix costs a
  # new version. This job runs the same two steps the Read the Docs build
  # does, so the two cannot disagree about whether the site is publishable.
  #
  # No PostgreSQL: the site renders the outputs the `notebooks` job above
  # produced, and never executes anything itself.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict
      # --strict only sees links in markdown pages. mkdocs-jupyter hands
      # MkDocs finished HTML, so the links written inside the notebooks are
      # invisible to it -- and those are the ones that move when a notebook
      # is published one directory deeper. See scripts/mkdocs_hooks.py.
      - run: python scripts/check_docs_links.py

  # Coverage gates the PR; mutation testing rides along in the same job so
  # both land in ONE sticky comment. Two jobs would mean two comments, or
  # an artifact hand-off just to merge two numbers.
  quality:
    name: coverage + mutation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # to upsert the sticky comment

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: hopai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      HOPAI_TEST_DSN: postgresql+psycopg2://postgres:testpass@localhost:5432/hopai
      HOPAI_REQUIRE_DB: "1"
      COVERAGE_THRESHOLD: "85"
      # Wall-clock cap on mutmut. Mutation is worth having and not worth
      # waiting on: past this the run is stopped and whatever it finished
      # is reported as partial.
      #
      # Raised from 900, then from 1800, and the reason is the same both
      # times: the budget is not spent on mutants alone. Before the first
      # one mutmut runs the whole suite for a baseline and again under
      # tracing to map tests to lines, and that fixed cost grows with the
      # suite -- at ~1400 tests it consumed 900s outright, and at ~2600 it
      # consumed 1800s, each time reporting zero checked.
      #
      # MEASURED rather than guessed this time: at the 9-file scope of a
      # large PR, the first mutant verdict arrives 321s in on a quiet
      # developer machine. CI reached none inside 1800s, so a runner is
      # several times slower than that -- tracing is the expensive half,
      # and it slows every test in the suite at once. 3600 buys real
      # mutants on a runner instead of only paying the entry fee.
      #
      # It is a budget, not a target: the report already distinguishes
      # "stopped early, here is what it checked" from "checked nothing",
      # so a partial run is honest evidence and only a zero run is not.
      #
      # Then 3600 turned out to be too long, and the failure mode is worth
      # writing down because it is the opposite of the one above. mutmut
      # DID work -- 7223 of 10775 mutants, 6924 killed, 297 survived -- and
      # the job still went red, because the runner was reclaimed at ~42
      # minutes ("received a shutdown signal") before `timeout` could stop
      # mutmut itself. mutmut stopping is handled: exit 124 renders a
      # partial report. The RUNNER stopping is not: the report step never
      # runs, and honest partial evidence becomes a failed check.
      #
      # Then 2100 was reclaimed too, at 1720s -- INSIDE its own budget, so
      # `timeout` never fired. Measured across two runs the runner gave us
      # 1720s once and ~2500s the next: not a limit to compute against,
      # just eviction. And when it happens every later step is SKIPPED --
      # render report, upsert comment, enforce coverage -- so the job goes
      # red having produced 5770 mutants' worth of evidence it then threw
      # away.
      #
      # 900 is chosen to FINISH rather than to maximise mutants: ~15
      # minutes of mutation on top of ~3 of coverage, well inside what has
      # been survivable, for a few thousand mutants of real evidence.
      # Nothing here is worth a red check on an advisory job -- a smaller
      # honest report every time beats a bigger one that usually vanishes,
      # and the number can go up again the day someone wants a deeper
      # sweep and is willing to re-run it.
      MUTATION_BUDGET_SECONDS: "900"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the mutation scope is a diff against the base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev,mutation]"

      - name: Measure coverage
        # No --cov-fail-under here on purpose: the threshold is enforced
        # in the LAST step, so a failing PR still gets its comment saying
        # by how much it fell short.
        run: pytest tests/ -q --cov=hopai --cov-report=xml --cov-report=term

      - name: Resolve mutation scope
        id: scope
        # Mutate only what this PR touched. A full run over hopai/ is
        # thousands of mutants; the changed lines are where a missing
        # assertion was just introduced.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            CHANGED=$(git diff --name-only --diff-filter=d "${BASE_SHA}" HEAD -- 'hopai/*.py' | tr '\n' ' ')
          else
            CHANGED=""
          fi
          if [ -z "${CHANGED// /}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "note=No files under \`hopai/\` changed, so there was nothing to mutate." >> "$GITHUB_OUTPUT"
          else
            COUNT=$(echo "${CHANGED}" | wc -w | tr -d ' ')
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "note=Scope: ${COUNT} changed file(s) under \`hopai/\`." >> "$GITHUB_OUTPUT"
            # Narrow source_paths in the checked-out copy. The committed
            # value covers the whole package for local runs; `hopai` stays
            # in also_copy, so the package is still whole in the mutants
            # tree (without it every test dies on an import error).
            #
            # The paths MUST be newline-separated (the ini continuation
            # format also_copy uses): mutmut reads a space-separated line
            # as ONE path that does not exist, mutates 0 files, and still
            # exits 0 -- so every multi-file PR silently reported
            # "not run" instead of any verdict.
            python - "$CHANGED" <<'PY'
          import re, sys
          paths = "\n    ".join(sys.argv[1].split())
          config = open("setup.cfg").read()
          open("setup.cfg", "w").write(
              re.sub(r"^source_paths = .*$", f"source_paths = {paths}", config, count=1, flags=re.M))
          PY
          fi

      - name: Run mutation testing
        if: steps.scope.outputs.run == 'true'
        # Never fails the job. `timeout` stops a long run and the stats
        # export below still reports what completed.
        continue-on-error: true
        run: |
          set -uo pipefail
          # 124 is timeout(1) saying it killed the run. Recorded rather
          # than folded into "stopped early": a budget exhausted before
          # the first mutant and a broken mutants tree both report zero
          # checked, and they need opposite fixes.
          timeout "${MUTATION_BUDGET_SECONDS}" mutmut run || \
            { status=$?
              [ "$status" = 124 ] && echo "MUTATION_TIMED_OUT=1" >> "$GITHUB_ENV"
              echo "::notice::mutmut stopped early (exit $status); reporting partial results"; }
          mutmut export-cicd-stats || true
          mutmut results > survivors.txt 2>&1 || true
          # The mutation OF each survivor, for the report's table --
          # otherwise triaging the comment starts by running this same
          # command forty times by hand. Driven by --list-survivors so
          # "which mutants matter" stays one rule in pr_report.py rather
          # than a second one in shell; `mutmut results` also lists
          # thousands of unchecked mutants nobody wants a diff for.
          : > diffs.txt
          python scripts/pr_report.py --mutmut-results survivors.txt --list-survivors \
            | while IFS= read -r mutant; do
                [ -n "$mutant" ] && mutmut show "$mutant" >> diffs.txt 2>/dev/null || true
              done

      - name: Render report
        id: report
        # The note reaches the script through the environment, never
        # through `${{ }}` inside the script body. Interpolating it
        # produced `No files under  changed` -- the backticks around
        # `hopai/` were read by the shell as command substitution, which
        # is a mangled comment in the benign case and arbitrary execution
        # in the general one.
        env:
          MUTATION_NOTE: ${{ steps.scope.outputs.note }}
          # Set only when mutmut was actually invoked, so "no results"
          # can be reported as a broken harness rather than as an empty
          # scope. The two must never look alike.
          MUTATION_ATTEMPTED: ${{ steps.scope.outputs.run == 'true' && '1' || '' }}
          # Exported by the step above when timeout(1) killed the run.
          MUTATION_BUDGET: ${{ env.MUTATION_BUDGET_SECONDS }}
        run: |
          set -euo pipefail
          python scripts/pr_report.py \
            --coverage-xml coverage.xml \
            --threshold "${COVERAGE_THRESHOLD}" \
            --mutmut-stats mutants/mutmut-cicd-stats.json \
            --mutmut-results survivors.txt \
            --mutmut-diffs diffs.txt \
            --mutation-note "${MUTATION_NOTE}" \
            ${MUTATION_ATTEMPTED:+--mutation-attempted} \
            ${MUTATION_TIMED_OUT:+--mutation-timed-out "${MUTATION_BUDGET}"} \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert sticky comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # BEST-EFFORT ON PURPOSE. Posting the comment is a convenience:
        # the same report is already in $GITHUB_STEP_SUMMARY and uploaded
        # as the quality-report artifact, so a failed API call loses a
        # copy, not the evidence. It used to `set -e` on any gh failure,
        # which meant one GitHub blip turned a green suite, a finished
        # mutation run and a rendered report into a red check -- AND
        # skipped `Enforce coverage threshold` below, so the cosmetic
        # step could suppress the real gate. A ::warning:: says the
        # comment is missing without pretending the code is broken.
        run: |
          set -euo pipefail
          MISSING="the report is in the job summary and the quality-report artifact"
          # One comment per PR: find the previous one by its marker and
          # PATCH it, else POST. The body goes through json.dumps so no
          # markdown character can corrupt the payload.
          python -c "import json;print(json.dumps({'body': open('comment.md').read()}))" > payload.json
          # gh's output is captured whole and narrowed afterwards, NOT
          # piped into `head -n1`: head closes the pipe as soon as it has
          # its line, and a --paginate still writing at that moment dies
          # of SIGPIPE, which pipefail then reports as a failed step. The
          # narrowing still has to happen -- --paginate applies --jq per
          # PAGE, so two pages could each yield an id if the marker ever
          # appears twice, and a two-line id would build a broken URL.
          FOUND=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq 'first(.[] | select(.body | startswith("<!-- hopai-pr-report -->")) | .id) // empty') \
            || { echo "::warning::could not list PR comments; ${MISSING}"; exit 0; }
          EXISTING=$(printf '%s\n' "${FOUND}" | head -n1)
          if [ -n "${EXISTING}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING}" --input payload.json >/dev/null \
              && echo "updated sticky comment ${EXISTING}" \
              || echo "::warning::could not update sticky comment ${EXISTING}; ${MISSING}"
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" --input payload.json >/dev/null \
              && echo "created sticky comment" \
              || echo "::warning::could not create the sticky comment; ${MISSING}"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: |
            coverage.xml
            comment.md
            survivors.txt
            mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore

      - name: Enforce coverage threshold
        # Last, so the comment is already posted when this fails -- but
        # `always()` so that ordering cannot become a dependency. Without
        # it a step above failing SKIPS this one, and the job goes red
        # for that failure while the number this job exists to check went
        # unread. The gate is what decides the check; everything above it
        # is reporting.
        if: always()
        run: |
          set -euo pipefail
          PERCENT=$(python -c "
          import xml.etree.ElementTree as ET
          print(f\"{float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100:.2f}\")")
          echo "line coverage: ${PERCENT}% (required ${COVERAGE_THRESHOLD}%)"
          python -c "
          import sys
          sys.exit(0 if float('${PERCENT}') >= float('${COVERAGE_THRESHOLD}') else 1)" || {
            echo "::error::coverage ${PERCENT}% is below the required ${COVERAGE_THRESHOLD}%"
            exit 1
          }

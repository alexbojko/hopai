name: Release

# Three steps, one workflow, all on a push to main:
#
#   1. release-please reads the Conventional Commits since the last tag
#      and keeps ONE open "chore(main): release x.y.z" pull request with
#      the version bump and the CHANGELOG entry. Merging that PR is the
#      act of releasing: it tags the commit and creates the GitHub
#      Release.
#   2. That same run then builds the sdist + wheel and publishes them to
#      PyPI -- but only on the run where the release was actually
#      created, which is why the publish job keys off
#      `release_created` rather than off the tag.
#   3. And it builds the documentation site and deploys it to GitHub
#      Pages, off the same signal. Deploying only on release is what makes
#      the published site mean something: it is the documentation for the
#      version that is on PyPI, not for whatever landed on main an hour
#      ago. Every PR still BUILDS the site (the `docs` job in ci.yml), so
#      a broken site is caught long before it can block a release.
#
# Publishing uses PyPI Trusted Publishing (OIDC): no API token is stored
# anywhere. PyPI is told to trust this repository, this workflow file and
# the `pypi` environment, and the runner exchanges a short-lived identity
# token for an upload token. If you rename this file or the environment,
# update the publisher on PyPI or the upload will start failing.

# A GitHub Release created with GITHUB_TOKEN does NOT fire the `release`
# event, so publishing cannot be triggered by "release published" -- it
# has to be chained onto the same run. The workflow_dispatch input is the
# way back in when that chain does not run: re-publishing a tag whose
# upload failed, or publishing a tag that was made by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Existing tag to build and publish (e.g. v0.0.1). Leave empty to only run release-please."
        type: string
        required: false
        default: ""
      # Separate from publish_tag on purpose. Re-deploying the site for a
      # tag is safe and repeatable; re-running the PyPI upload for one is
      # neither -- that version is already there and the upload fails. One
      # input for both would make "republish the docs" a broken release run.
      docs_tag:
        description: "Existing tag to build and deploy the documentation for (e.g. v0.0.1)."
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release-please:
    # A bare dispatch (no tag named) still runs release-please; a dispatch
    # that names a tag is asking for that one artifact and nothing else.
    if: >-
      github.event_name == 'push' ||
      (inputs.publish_tag == '' && inputs.docs_tag == '')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to create the release commit, tag and Release
      pull-requests: write   # to open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # Runs when release-please just cut a release, or when a tag was
    # named by hand. `always()` is needed because the release-please job
    # is skipped on the manual path, and a skipped dependency would
    # otherwise skip this one too.
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       inputs.publish_tag != '')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hopai
    permissions:
      contents: read
      id-token: write        # required for Trusted Publishing; nothing else grants it
    steps:
      - uses: actions/checkout@v4
        with:
          # The release commit is already on main by the time this runs;
          # check out the tag so the artifact is built from exactly what
          # was released, not from whatever landed a minute later.
          ref: ${{ needs.release-please.outputs.tag_name || inputs.publish_tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata renders on PyPI
        # PyPI rejects a bad long_description at upload time, after the
        # version number is already burned. Failing here costs nothing.
        run: twine check --strict dist/*

      - name: Verify the built version matches the tag
        # A mismatch means the release commit and the built tree
        # disagree, and the upload would silently claim the wrong
        # version. Cheap to check, impossible to undo on PyPI.
        env:
          EXPECTED: ${{ needs.release-please.outputs.version || inputs.publish_tag }}
        run: |
          set -euo pipefail
          BUILT=$(ls dist/*.tar.gz | sed -E 's/.*hopai-(.*)\.tar\.gz/\1/')
          # The manual path passes a tag (v0.0.1); the release-please
          # path passes a bare version (0.0.1). Compare like with like.
          WANT="${EXPECTED#v}"
          echo "expected ${WANT}, artifact says ${BUILT}"
          test "${BUILT}" = "${WANT}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ needs.release-please.outputs.version || inputs.publish_tag }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `with: password:` on purpose -- the OIDC identity above is
        # the credential. Adding a token would take the untrusted path.

  # The documentation site. Deliberately NOT `needs: publish`: the docs
  # describe the tag, and they are worth having even if a PyPI upload had to
  # be retried. The two run side by side off the same release signal.
  #
  # Requires Pages to be set to "Deploy from GitHub Actions" once, in
  # Settings -> Pages. Like the PyPI job this stores no credential: the
  # id-token permission below is what the deployment is authenticated with.
  docs:
    needs: release-please
    # Same shape as `publish` above, and for the same reason: the
    # release-please job is skipped on the manual path, and a skipped
    # dependency would otherwise skip this one too.
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       inputs.docs_tag != '')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write           # to publish the artifact to Pages
      id-token: write        # required to authenticate the deployment
    # Two release runs overlapping would race to publish two different
    # versions of the site. Queue them instead, and never cancel one
    # half-deployed.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Build from the tag, not from main -- same reasoning as the
          # publish job: the site has to describe what was released.
          ref: ${{ needs.release-please.outputs.tag_name || inputs.docs_tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[docs]"

      # --strict here as well as in CI. CI proved the site built on main;
      # this proves it builds from the tag, which is what gets published.
      - name: Build the site
        run: mkdocs build --strict

      - name: Check every internal link resolves
        run: python scripts/check_docs_links.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

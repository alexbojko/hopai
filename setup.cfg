# mutmut's only config surface is an ini section, which is why this file
# exists at all -- everything else about the project lives in
# pyproject.toml.
#
#   pip install -e ".[dev,mutation]"
#   docker compose up -d
#   mutmut run                # mutate all of hopai/ (slow: minutes to hours)
#   mutmut run hopai/hop.py   # one module, which is the usual local loop
#   mutmut results            # survivors
#   mutmut show <id>          # the diff of one survivor
#
# CI rewrites `source_paths` to just the files a PR changed; see
# .github/workflows/ci.yml. Mutation is advisory there and never blocks a
# merge -- but survivors must be triaged, not skimmed. See CLAUDE.md.
[mutmut]
source_paths = hopai

# The kill set. Running the whole suite per mutant is affordable here
# because it takes seconds, and a narrower selection would let a mutant
# survive purely because the test that kills it was not run.
pytest_add_cli_args_test_selection = tests

# mutmut copies source_paths into a `mutants/` tree and runs pytest from
# inside it, so anything the suite reads has to come along. Missing
# `tests/` means zero tests collected and every mutant "surviving";
# missing pyproject.toml means no pytest config.
#
# `hopai` is listed here as well as in source_paths on purpose. When
# source_paths narrows to a few files (which is what CI does), only those
# files get copied, and the package left in the mutants tree has no
# __init__.py -- every test then dies on `cannot import name ... from
# 'hopai' (unknown location)` and every mutant "survives". Copying the
# package too keeps it whole; the mutated files are written over it.
# Anything the SUITE reads, not just what it imports. tests/test_packaging.py
# asserts on the release config and the CI workflow, and a file missing from
# the mutants tree fails the baseline run -- at which point mutmut aborts
# before checking a single mutant and the report reads "not run".
also_copy = hopai
    tests
    scripts
    benchmarks
    pyproject.toml
    docker-compose.yml
    setup.cfg
    README.md
    CLAUDE.md
    docs
    .github
    release-please-config.json
    .release-please-manifest.json

# A line no test executes cannot kill anything mutated on it, so mutating
# it only buys survivors that say what `coverage` already said. Needs a
# .coverage file present -- CI writes one in the step before.
mutate_only_covered_lines = true

# Do not stop descending at an arbitrary depth: hopai's writes reach the
# database through several layers (Graph -> Ingestor -> SQLAlchemy), and
# a shallow cap would score mutants as unreached that tests do exercise.
max_stack_depth = -1

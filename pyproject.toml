[project]
name = "hopai"
# Managed by release-please -- do not bump by hand. A commit whose
# subject starts `feat:` moves the minor, `fix:` the patch, and
# `feat!:` (or a `BREAKING CHANGE:` footer) the major. See CLAUDE.md.
version = "0.0.1"
description = "A knowledge graph in the PostgreSQL you already run: multi-hop traversal, ingestion and real constraints, with Python, JSON and Cypher interfaces -- no graph database required."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Oleksandr Boiko", email = "django.develop@gmail.com"}]
keywords = [
    "graph", "knowledge-graph", "postgresql", "postgres", "cypher",
    "graph-database", "sqlalchemy", "traversal", "llm", "agents", "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "sqlmodel>=0.0.39",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[project.urls]
Homepage = "https://github.com/alexbojko/hopai"
Repository = "https://github.com/alexbojko/hopai"
Issues = "https://github.com/alexbojko/hopai/issues"
Changelog = "https://github.com/alexbojko/hopai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
networkx = ["networkx>=3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "networkx>=3.0", "ruff>=0.6"]
# Pinned <4 deliberately: the config surface this project relies on
# (`source_paths`, `also_copy`, `mutate_only_covered_lines`, and the
# `export-cicd-stats` JSON the PR comment parses) is the documented 3.x
# contract, and a major bump could change any of it. See setup.cfg.
mutation = ["mutmut>=3.6.0,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hopai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:hopai.*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
]
ignore = [
    "E501",    # long lines are capped by line-length above, not flagged per line
    "B008",    # call-in-default is how SQLAlchemy columns are declared
    "SIM108",  # a ternary is not always clearer than an if/else
    # The codebase spells optionals `Optional[X]` throughout. That is a
    # consistent choice, not an oversight, and churning every signature to
    # `X | None` would touch far more than it improves.
    "UP007", "UP045",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on construction and re-import inside test bodies on purpose.
"tests/*" = ["B011", "E731"]

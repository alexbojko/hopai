[project]
name = "hopai"
version = "0.1.0"
description = "Graph traversal on plain PostgreSQL. Bounded and unbounded multi-hop queries, AND/OR/NOT/range filters, and a JSON interface for tool-calling agents -- no separate graph database required."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "sqlmodel>=0.0.39",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
networkx = ["networkx>=3.0"]
dev = ["pytest>=8.0", "networkx>=3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hopai*"]

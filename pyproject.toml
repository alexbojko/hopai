[project]
name = "hopai"
# Managed by release-please -- do not bump by hand. 0.0.0 means nothing
# has been released yet; the first release PR sets this to 0.0.1. While
# the project is below 1.0 every `feat:` and `fix:` bumps the PATCH, so
# 0.0.x stays a series where anything may change. See CLAUDE.md.
version = "0.0.1"
description = "A knowledge graph in the PostgreSQL you already run: multi-hop traversal, ingestion and real constraints, with Python, JSON and Cypher interfaces -- no graph database required."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Oleksandr Boiko", email = "django.develop@gmail.com"}]
keywords = [
    "graph", "knowledge-graph", "postgresql", "postgres", "cypher",
    "graph-database", "sqlalchemy", "traversal", "llm", "agents", "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[project.urls]
Homepage = "https://github.com/alexbojko/hopai"
Documentation = "https://hopai.readthedocs.io/"
Repository = "https://github.com/alexbojko/hopai"
Issues = "https://github.com/alexbojko/hopai/issues"
Changelog = "https://github.com/alexbojko/hopai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
networkx = ["networkx>=3.0"]
# schema_pydantic generates v2 models; this extra pins the MAJOR version
# so v1, tolerated by some resolutions, is never silently what lands.
pydantic = ["pydantic>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "networkx>=3.0", "pydantic>=2.0", "ruff>=0.6"]
# Only for executing notebooks/ -- see scripts/run_notebooks.py. Deliberately
# NOT part of `dev`: the notebooks are documentation, and running the test
# suite should not require a Jupyter stack. jupyterlab is left out too; nbclient
# executes them headlessly and `pip install jupyterlab` is the reader's call.
notebooks = ["nbclient>=0.10", "nbformat>=5.9", "ipykernel>=6.29",
             "networkx>=3.0", "pydantic>=2.0"]
# Building the documentation site (mkdocs.yml). Separate from `notebooks`
# because the two do opposite things: `notebooks` EXECUTES them against a
# database, while the site only renders the outputs already committed --
# so a docs build needs no PostgreSQL and no Jupyter kernel.
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocs-jupyter>=0.25"]
# Pinned <4 deliberately: the config surface this project relies on
# (`source_paths`, `also_copy`, `mutate_only_covered_lines`, and the
# `export-cicd-stats` JSON the PR comment parses) is the documented 3.x
# contract, and a major bump could change any of it. See setup.cfg.
mutation = ["mutmut>=3.6.0,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hopai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:hopai.*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
]
ignore = [
    "E501",    # long lines are capped by line-length above, not flagged per line
    "B008",    # call-in-default is how SQLAlchemy columns are declared
    "SIM108",  # a ternary is not always clearer than an if/else
    # The codebase spells optionals `Optional[X]` throughout. That is a
    # consistent choice, not an oversight, and churning every signature to
    # `X | None` would touch far more than it improves.
    "UP007", "UP045",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on construction and re-import inside test bodies on purpose.
"tests/*" = ["B011", "E731"]
